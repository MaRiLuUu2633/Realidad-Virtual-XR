<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Planta Industrial de Empaquetado XR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- ENTORNO: Piso y Pared de la fábrica -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#555555"></a-plane>
        <a-plane position="0 5 -11" width="20" height="10" color="#7F8C8D"></a-plane>
        <a-sky color="#EAEDED"></a-sky>

        <!-- SISTEMA INDUSTRIAL (Jerarquía principal) -->
        <a-entity id="linea-empaquetado" position="0 0 -6">

            <!-- 1. BANDA TRANSPORTADORA -->
            <!-- Patas de soporte -->
            <a-cylinder position="-3 0.5 0" radius="0.1" height="1" color="#F39C12"></a-cylinder>
            <a-cylinder position="-3 0.5 1" radius="0.1" height="1" color="#F39C12"></a-cylinder>
            <a-cylinder position="3 0.5 0" radius="0.1" height="1" color="#F39C12"></a-cylinder>
            <a-cylinder position="3 0.5 1" radius="0.1" height="1" color="#F39C12"></a-cylinder>
            
            <!-- Superficie de la banda -->
            <a-box position="0 1 0.5" width="7" height="0.1" depth="1.2" color="#2C3E50"></a-box>
            
            <!-- Rodillos en los extremos -->
            <a-cylinder position="-3.5 1 0.5" rotation="90 0 0" radius="0.05" height="1.2" color="#BDC3C7"></a-cylinder>
            <a-cylinder position="3.5 1 0.5" rotation="90 0 0" radius="0.05" height="1.2" color="#BDC3C7"></a-cylinder>
            
            <!-- Guías laterales para evitar que las cajas caigan -->
            <a-box position="0 1.15 -0.1" width="7" height="0.05" depth="0.05" color="#F39C12"></a-box>
            <a-box position="0 1.15 1.1" width="7" height="0.05" depth="0.05" color="#F39C12"></a-box>

            <!-- 2. ARCO DE ESCANEO / SENSORES -->
            <a-box position="0 1.5 -0.15" width="0.2" height="1" depth="0.2" color="#34495E"></a-box>
            <a-box position="0 1.5 1.15" width="0.2" height="1" depth="0.2" color="#34495E"></a-box>
            <a-box position="0 2.1 0.5" width="0.2" height="0.2" depth="1.5" color="#34495E"></a-box>
            <!-- Lente del escáner láser -->
            <a-sphere position="0 2 0.5" radius="0.08" color="#E74C3C"></a-sphere>

            <!-- 3. PRODUCTOS (Cajas en la banda) -->
            <a-box position="-2.5 1.35 0.5" width="0.6" height="0.6" depth="0.6" color="#D35400"></a-box>
            <a-box position="-0.8 1.35 0.5" width="0.6" height="0.6" depth="0.6" color="#E67E22"></a-box>
            <!-- Caja pasando justo por debajo del escáner -->
            <a-box position="0 1.35 0.5" width="0.6" height="0.6" depth="0.6" color="#D35400"></a-box>
            <a-box position="2 1.35 0.5" width="0.6" height="0.6" depth="0.6" color="#E67E22"></a-box>

            <!-- 4. BRAZO ROBÓTICO (Pick and Place) AL FINAL DE LA BANDA -->
            <a-entity id="robot-arm" position="4.2 0 0.5">
                <!-- Base -->
                <a-cylinder position="0 0.2 0" radius="0.5" height="0.4" color="#2980B9"></a-cylinder>
                <a-cylinder position="0 0.7 0" radius="0.3" height="0.6" color="#3498DB"></a-cylinder>
                <!-- Articulación 1 -->
                <a-sphere position="0 1 0" radius="0.25" color="#2C3E50"></a-sphere>
                <!-- Eslabón 1 -->
                <a-cylinder position="-0.5 1.5 0" rotation="0 0 45" radius="0.15" height="1.5" color="#3498DB"></a-cylinder>
                <!-- Articulación 2 -->
                <a-sphere position="-1 2 0" radius="0.2" color="#2C3E50"></a-sphere>
                <!-- Eslabón 2 bajando hacia la banda -->
                <a-cylinder position="-1 1.3 0" radius="0.1" height="0.8" color="#3498DB"></a-cylinder>
                <!-- Efector final (Pinza simple) -->
                <a-box position="-1 1.15 0" width="0.4" height="0.0" depth="0.4" color="#2C3E50"></a-box>
            </a-entity>

            <!-- 5. PANEL DE CONTROL (Pantalla HMI) -->
            <a-entity id="panel-hmi" position="-2 0 2.5" rotation="0 30 0">
                <!-- Pedestal -->
                <a-cylinder position="0 0.6 0" radius="0.08" height="1.2" color="#7F8C8D"></a-cylinder>
                <!-- Caja del panel -->
                <a-box position="0 1.3 0.1" rotation="-20 0 0" width="1" height="0.7" depth="0.2" color="#34495E"></a-box>
                <!-- Pantalla táctil HMI -->
                <a-plane position="0 1.32 0.21" rotation="-20 0 0" width="0.8" height="0.5" color="#85C1E9"></a-plane>
                <!-- Botón de parada de emergencia -->
                <a-cylinder position="0.35 1.15 0.25" rotation="-20 0 0" radius="0.06" height="0.05" color="#E74C3C"></a-cylinder>
            </a-entity>

        </a-entity>
    </a-scene>
</body>
</html>
