<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Planta Industrial XR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- PISO Y CIELO -->
        <a-plane rotation="-90 0 0" width="20" height="20" color="#95A5A6"></a-plane>
        <a-sky color="#D6EAF8"></a-sky>

        <!-- CELDA DE MANUFACTURA (Jerarquía espacial usando <a-entity>) -->
        <a-entity id="celda-embotellado" position="0 0 -5">
            
            <!-- 1. TANQUE DE ALMACENAMIENTO (a-cylinder) -->
            <!-- Tanque principal de color ámbar -->
            <a-cylinder position="-2 1.5 0" radius="1" height="3" color="#F39C12"></a-cylinder>
            
            <!-- Tapa del tanque -->
            <a-cylinder position="-2 3.05 0" radius="1.05" height="0.1" color="#34495E"></a-cylinder>

            <!-- 2. SENSOR DE NIVEL (a-sphere) -->
            <!-- Luz indicadora en la parte superior -->
            <a-sphere position="-2 3.3 0" radius="0.2" color="#E74C3C"></a-sphere>

            <!-- 3. BANDA TRANSPORTADORA (a-box y a-cylinder) -->
            <!-- Superficie de la banda -->
            <a-box position="1.5 0.5 0" width="4" height="0.1" depth="0.8" color="#2C3E50"></a-box>
            
            <!-- Soportes cilíndricos de la banda -->
            <a-cylinder position="-0.3 0.25 0" radius="0.05" height="0.5" color="#7F8C8D"></a-cylinder>
            <a-cylinder position="3.3 0.25 0" radius="0.05" height="0.5" color="#7F8C8D"></a-cylinder>

            <!-- 4. PRODUCTOS (a-cylinder) -->
            <!-- Botella en proceso de llenado bajo la válvula -->
            <a-cylinder position="-0.5 0.7 0" radius="0.15" height="0.3" color="#FDEDEC"></a-cylinder>
            <!-- Botella terminada avanzando en la banda -->
            <a-cylinder position="2 0.7 0" radius="0.15" height="0.3" color="#F39C12"></a-cylinder>
            
            <!-- 5. PANEL DE CONTROL (a-box) -->
            <a-box position="-3.5 1 1" width="0.8" height="1.2" depth="0.2" color="#BDC3C7" rotation="0 45 0"></a-box>
            <!-- Botón en el panel (a-sphere) -->
            <a-sphere position="-3.3 1.2 1.1" radius="0.08" color="#2ECC71"></a-sphere>

        </a-entity>
    </a-scene>
</body>
</html>
